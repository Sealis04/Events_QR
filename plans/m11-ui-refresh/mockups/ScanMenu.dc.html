<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gate phone menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #05080d; color: #f3f4f6; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; position: relative">
<div style="position: absolute; inset: 0; background: #0b0f17; opacity: 0.5"></div>
<div style="position: relative; background: #141a24; border-radius: 22px 22px 0 0; border-top: 1px solid #2a3240; padding: 10px 16px 24px; display: flex; flex-direction: column; gap: 6px">
<div style="width: 44px; height: 5px; border-radius: 999px; background: #3a4352; align-self: center; margin-bottom: 8px"></div>
<div style="font-size: 13px; color: #aab3c2; padding: 0 4px 6px">Phone 3 · Main entrance · Entry and exit</div>

<button style="height: 56px; border: 0; border-radius: 12px; background: transparent; color: #f3f4f6; font-size: 17px; font-weight: 600; text-align: left; padding: 0 12px">Switch staff member</button>
<button style="height: 56px; border: 0; border-radius: 12px; background: transparent; color: #f3f4f6; font-size: 17px; font-weight: 600; text-align: left; padding: 0 12px">Camera help</button>
<button style="height: 56px; border: 0; border-radius: 12px; background: transparent; color: #f3f4f6; font-size: 17px; font-weight: 600; text-align: left; padding: 0 12px">Sign out</button>
<div style="height: 1px; background: #2a3240; margin: 6px 0"></div>

<div style="border: 1px solid #5c2424; background: #2a1414; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 17px; font-weight: 700; color: #fecaca">Set this phone up again?</div>
<div style="font-size: 15px; color: #f3d0d0; line-height: 1.45">This erases the event, tickets and logins from this phone. You will need a new setup code from a supervisor. All scans are already uploaded.</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button style="height: 52px; border: 1px solid #3a4352; border-radius: 12px; background: #141a24; color: #f3f4f6; font-weight: 600; font-size: 16px">Keep phone</button>
<button style="height: 52px; border: 0; border-radius: 12px; background: #dc2626; color: #ffffff; font-weight: 700; font-size: 16px">Erase and set up</button>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

return {};
}
}

</body>
</html>
